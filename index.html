<!doctype html><html><head><meta charset="UTF-8"><title>LogiFlow</title><style>body{margin:0;font-family:Inter,sans-serif;background:#0d1023;color:#e5e7eb}aside{width:260px;background:#131833;position:fixed;top:0;bottom:0;padding:20px}main{margin-left:260px;padding:20px}.card{background:#1b2147;border:1px solid #3f46a1;border-radius:12px;padding:16px;margin:12px 0}input,select,textarea,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #4248b8;background:#101534;color:#fff}button{background:#6d28d9;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style></head><body><aside><h2>LogiFlow</h2><p>API Canvas</p><p>Infrastructure Manager</p><p>GitOps SDK Sync Console</p><p>System Logs</p></aside><main><h1>Infrastructure Manager</h1><div class="grid"><div class="card"><h3>Create database</h3><input id="name" placeholder="Database Name"><input id="username" placeholder="Admin Username"><input id="password" placeholder="Admin Password"><select id="engine"><option>postgres</option><option>mysql</option><option>mongo</option><option>redis</option><option>access</option><option>excel</option></select><button onclick="createDb()">+ Create database</button></div><div class="card"><h3>Run query</h3><select id="dbId"></select><textarea id="query" rows="6" placeholder='SQL, JSON for Mongo, "SET key value" for Redis, or READ'></textarea><textarea id="values" rows="3" placeholder='JSON array values'></textarea><button onclick="runQuery()">Run Query</button></div></div><div class="card"><h3>Output</h3><pre id="out"></pre></div></main><script>
async function refresh(){const dbs=await (await fetch('/api/infrastructure')).json();const s=document.getElementById('dbId');s.innerHTML=dbs.map(d=>`<option value="${d.id}">${d.id}</option>`).join('');}
async function createDb(){const body={name:name.value,username:username.value,password:password.value,engine:engine.value};const r=await fetch('/api/infrastructure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});out.textContent=JSON.stringify(await r.json(),null,2);refresh();}
async function runQuery(){const vals=values.value?JSON.parse(values.value):[];const r=await fetch('/api/query/'+dbId.value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query.value,values:vals})});out.textContent=JSON.stringify(await r.json(),null,2);}refresh();
</script></body></html>
