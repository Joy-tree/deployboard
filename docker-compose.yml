services:
  app:
    build: .
    container_name: deployboard
    restart: unless-stopped
    init: true
    ports:
      - "3001:3001"
      # User app ports — each deployed Node.js app gets one of these
      - "4000-4099:4000-4099"
      # Database container ports — MongoDB/MySQL/Postgres/Redis all land here
      - "14000-15000:14000-15000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/__internal_heartbeat 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SITES_DIR=/var/www/user-sites
      - TMP_DIR=/tmp/deployboard-builds
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      # [FIX] false so DB subdomains get their own DNS-only A records in Cloudflare.
      # With wildcard mode on, registerSubdomain() returns early and never creates
      # the db-xxx.joytree.site record — making every user database unreachable.
      - CF_WILDCARD_MODE=false
      # [FIX] Force per-subdomain DNS records for DB subdomains even when a
      # wildcard already exists, so Cloudflare resolves them to the VPS IP directly.
      - CF_FORCE_SPECIFIC_RECORDS=true
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_TUNNEL_ID=${CF_TUNNEL_ID:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      # [FIX] Set your VPS public IP explicitly so DB subdomains get a grey-cloud
      # A record pointing straight at this machine. Without this, Cloudflare's
      # orange-cloud proxy intercepts all TCP (MongoDB, MySQL, Redis, Postgres)
      # and silently drops it — only HTTP/HTTPS goes through the tunnel.
      - VPS_IP=${VPS_IP:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - FIREBASE_RTDB_URL=${FIREBASE_RTDB_URL:-}
      - FIREBASE_RTDB_SECRET=${FIREBASE_RTDB_SECRET:-}
    volumes:
      - sites-data:/var/www/user-sites
      - /tmp/deployboard-builds:/tmp/deployboard-builds
      # Mount Docker socket so DeployBoard can spawn user app containers
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - deployboard-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 256m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deployboard-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN:-}
    networks:
      - deployboard-net

volumes:
  sites-data:

networks:
  deployboard-net:
    driver: bridge
