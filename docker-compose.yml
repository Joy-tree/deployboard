services:
  app:
    build: .
    container_name: deployboard
    restart: unless-stopped
    # [FIX] init: true makes Docker wrap the Node process with tini, a minimal
    # init that properly reaps zombie child processes. Without this, Node runs
    # as PID 1 which never calls wait() on finished children — causing curl/du
    # zombies to accumulate every minute until the process table is exhausted
    # and the container becomes unresponsive (Error 1033 / tunnel drops).
    init: true
    ports:
      - "3001:3001"
      # User app ports — each deployed Node.js app gets one of these
      - "4000-4099:4000-4099"
    # [FIX] Replaced the inherited/default healthcheck (curl with 5s timeout
    # that was failing and leaving zombie curl processes) with a lightweight
    # TCP-only check using /dev/tcp. This never spawns an external process so
    # it cannot create zombies, and it correctly reports healthy as long as
    # the Node server is listening on port 3001 — regardless of MongoDB/Firebase
    # connectivity, which was causing false unhealthy reports before.
    healthcheck:
      # [FIX] Now correctly targets /__internal_heartbeat — registered FIRST
      # in server.js before any heavy middleware (Firebase cache, MongoDB,
      # custom-domain resolution). This gives a true "is Express + event loop
      # actually responding" signal, not a "did the full request pipeline work"
      # signal. The || exit 0 fallback has been removed so Docker actually marks
      # the container unhealthy when the server stops responding — enabling
      # proper monitoring/alerting. NOTE: Docker marking unhealthy does NOT
      # restart the container (that's done by the in-process watchdog in
      # server.js calling process.exit(1) after 3 consecutive heartbeat
      # failures, which then triggers restart:unless-stopped). The healthcheck
      # here is for visibility/monitoring purposes.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/__internal_heartbeat 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SITES_DIR=/var/www/user-sites
      - TMP_DIR=/tmp/deployboard-builds
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - CF_WILDCARD_MODE=${CF_WILDCARD_MODE:-true}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_TUNNEL_ID=${CF_TUNNEL_ID:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - FIREBASE_RTDB_URL=${FIREBASE_RTDB_URL:-}
      - FIREBASE_RTDB_SECRET=${FIREBASE_RTDB_SECRET:-}
    volumes:
      - sites-data:/var/www/user-sites
      - /tmp/deployboard-builds:/tmp/deployboard-builds
      # Mount Docker socket so DeployBoard can spawn user app containers
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - deployboard-net
    deploy:
      resources:
        limits:
          memory: 2g        # DeployBoard orchestrator itself gets 2GB for build ops
          cpus: '2.0'
        reservations:
          memory: 256m

  # [FIX] cloudflared runs as its own isolated container so a Node.js crash,
  # OOM event, or unhealthy status in the app container CANNOT take down the
  # tunnel. It reconnects independently and stays up even while the app restarts.
  # Token is passed via --token flag, matching the previous systemd service setup.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deployboard-tunnel
    restart: unless-stopped
    # [FIX] Pass token directly via --token flag — same as the old systemd
    # ExecStart command. Add CF_TUNNEL_TOKEN=<your_token> to your .env file.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN:-}
    networks:
      - deployboard-net

  # MCP server that lets Claude (and other MCP clients) deploy, manage
  # databases, and generate APIs on JoyTree directly — see
  # joytree-mcp-server/README.md for what it exposes and why it exists.
  # The joytree-mcp service used to live here, but it now lives in its own
  # repo (github.com/Joy-tree/joytree-mcp-server) with its own
  # docker-compose.yml, run independently on this same VPS. Keeping two
  # compose projects both trying to own a container named "joytree-mcp"
  # caused a name conflict, so it's been removed from here.

volumes:
  sites-data:

networks:
  deployboard-net:
    name: deployboard-net
    driver: bridge
