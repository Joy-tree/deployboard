services:
  app:
    build: .
    container_name: deployboard
    restart: unless-stopped
    init: true
    ports:
      - "3001:3001"
      - "4000-4099:4000-4099"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/__internal_heartbeat 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SITES_DIR=/var/www/user-sites
      - TMP_DIR=/tmp/deployboard-builds
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - CF_WILDCARD_MODE=${CF_WILDCARD_MODE:-true}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_TUNNEL_ID=${CF_TUNNEL_ID:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - FIREBASE_RTDB_URL=${FIREBASE_RTDB_URL:-}
      - FIREBASE_RTDB_SECRET=${FIREBASE_RTDB_SECRET:-}
      # ── MongoDB (internal) ───────────────────────────────────────
      - MONGODB_URI=mongodb://Mongodb:${MONGO_PASSWORD:-mongodbd}@mongo:27017/deployboard?authSource=admin
    volumes:
      - sites-data:/var/www/user-sites
      - /tmp/deployboard-builds:/tmp/deployboard-builds
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - deployboard-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 256m

  mongo:
    image: mongo:7
    container_name: deployboard-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=Mongodb
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongodbd}
      - MONGO_INITDB_DATABASE=deployboard
    ports:
      # Exposed on host so tenant apps can connect via db-XXXXX.joytree.site:14002
      - "14002:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - deployboard-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: deployboard-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${CF_TUNNEL_TOKEN:-}
    networks:
      - deployboard-net

volumes:
  sites-data:
  mongo-data:

networks:
  deployboard-net:
    driver: bridge
