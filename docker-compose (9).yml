services:
  app:
    build: .
    container_name: deployboard
    restart: unless-stopped
    ports:
      - "3001:3001"
      # User app ports — each deployed Node.js app gets one of these
      - "4000-4099:4000-4099"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI}
      - SITES_DIR=/var/www/user-sites
      - TMP_DIR=/tmp/deployboard-builds
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - CF_WILDCARD_MODE=${CF_WILDCARD_MODE:-true}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_TUNNEL_ID=${CF_TUNNEL_ID:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - FIREBASE_RTDB_URL=${FIREBASE_RTDB_URL:-}
      - FIREBASE_RTDB_SECRET=${FIREBASE_RTDB_SECRET:-}
    volumes:
      - sites-data:/var/www/user-sites
      - /tmp/deployboard-builds:/tmp/deployboard-builds
      # Mount Docker socket so DeployBoard can spawn user app containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - deployboard-net
    deploy:
      resources:
        limits:
          memory: 2g        # DeployBoard orchestrator itself gets 2GB for build ops
          cpus: '2.0'
        reservations:
          memory: 256m

  mongo:
    image: mongo:7-jammy
    container_name: deployboard-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deployboard-net

volumes:
  sites-data:
  mongo-data:

networks:
  deployboard-net:
    driver: bridge
