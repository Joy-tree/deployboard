# JoyTree MCP server — routes mcp.joytree.site straight to the
# joytree-mcp container (port 8787), bypassing the wildcard rule in
# deployboard.conf that would otherwise send it to DeployBoard itself.
#
# nginx matches an exact server_name (this file) before it falls through
# to the regex wildcard in deployboard.conf, so this takes priority
# automatically — no changes needed to deployboard.conf itself.
#
# File: /etc/nginx/conf.d/mcp.conf

server {
    listen 80;
    server_name mcp.joytree.site;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
