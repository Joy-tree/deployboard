<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Joytree logo</title>
  <desc id="desc">A glowing tree growing from a green planet inside a luminous ring.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#12344f"/>
      <stop offset="100%" stop-color="#020916"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aff6f"/>
      <stop offset="100%" stop-color="#35f2d0"/>
    </linearGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72ff65"/>
      <stop offset="100%" stop-color="#0b772e"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ffd8"/>
      <stop offset="100%" stop-color="#38d68f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="220" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="108" r="92" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.95" filter="url(#glow)"/>
  <circle cx="110" cy="140" r="44" fill="url(#planet)" filter="url(#glow)"/>
  <path d="M96 151c9-8 18-8 27 0" fill="none" stroke="#b8ff76" stroke-width="2" opacity="0.8"/>
  <path d="M110 139V91" fill="none" stroke="url(#trunk)" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 108c-24 0-41-14-50-32 17 4 31 11 45 25" fill="none" stroke="#6dff84" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 108c24 0 41-14 50-32-17 4-31 11-45 25" fill="none" stroke="#4ef0c3" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 96c-17 0-30-10-36-22 13 3 23 8 33 18" fill="none" stroke="#95ff72" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 96c17 0 30-10 36-22-13 3-23 8-33 18" fill="none" stroke="#73ffe2" stroke-width="3" stroke-linecap="round"/>
  <g fill="#a9ff6f" opacity="0.9">
    <circle cx="70" cy="84" r="2.2"/><circle cx="146" cy="74" r="2.2"/><circle cx="156" cy="101" r="2.2"/><circle cx="84" cy="66" r="2.2"/>
  </g>
</svg>
